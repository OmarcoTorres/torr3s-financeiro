<!doctype html>
<html lang="pt-BR" data-theme="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="Invest+" />
    <meta name="theme-color" content="#f4f5fa" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Invest+</title>
    <meta name="description" content="Invest+: dashboard financeiro com transações, cartões, metas e relatórios." />
  </head>
  <body>
    <script>
      // Kaya Life (kayalife.vercel.app ou /kaya): manifesto, nome e ícone próprios para instalar como "Kaya Life".
      (function () {
        var kaya = /^kayalife\./.test(location.hostname) || /^\/kaya(\/|$)/.test(location.pathname);
        if (!kaya) return;
        var set = function (sel, attr, v) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, v); };
        set('link[rel="manifest"]', "href", "/kaya/manifest.webmanifest");
        set('link[rel="apple-touch-icon"]', "href", "/kaya/apple-touch-icon.png");
        set('link[rel="icon"]', "href", "/kaya/icon-192.png");
        set('meta[name="apple-mobile-web-app-title"]', "content", "Kaya Life");
        set('meta[name="theme-color"]', "content", "#FAF8F3");
        document.title = "Kaya Life";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
